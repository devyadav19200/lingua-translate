name: lingua_translate
description: A production-ready cross-platform translation app with voice input/output.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Speech-to-Text
  speech_to_text: ^6.6.2

  # Text-to-Speech
  flutter_tts: ^4.0.2

  # HTTP for Translation API
  http: ^1.2.1

  # Local Storage (History)
  shared_preferences: ^2.2.3

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2

  # Clipboard
  clipboard: ^0.1.3

  # Connectivity
  connectivity_plus: ^6.0.3

  # Uuid for history IDs
  uuid: ^4.4.0

  # Intl for date formatting
  intl: ^0.19.0

  # Shimmer loading effect
  shimmer: ^3.0.0

  # Animated text
  animated_text_kit: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
